<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Realtime</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div id="loginModal" class="modal active">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="app-info">
                        <h1 class="app-name">ChatLive</h1>
                        <p class="slogan">Hãy cùng trò chuyện và kết nối mọi khoảnh khắc</p>
                    </div>
                </div>
                <div class="login-form">
                    <div class="input-group">
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="usernameInput" placeholder="Nhập tên hiển thị của bạn..." maxlength="20"
                            autocomplete="off">
                    </div>
                    <button id="loginBtn" class="btn-primary">
                        <span>Tham gia Chat</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <div class="features">
                        <div class="feature">
                            <i class="fas fa-users"></i>
                            <span>Chat nhóm realtime</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-bolt"></i>
                            <span>Tin nhắn tức thì</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-images"></i>
                            <span>Images &<br>Stickers</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="chatApp" class="chat-app hidden">
            <header>
                <div class="header-left">
                    <button id="backBtn" class="mobile-only icon-btn"><i class="fas fa-arrow-left"></i></button>
                    <h1>💬 Chat Realtime</h1>
                </div>
                <div class="user-info">
                    <span id="currentUser"></span>
                    <span id="onlineCount" class="online-badge">0 online</span>
                </div>
            </header>

            <div class="chat-container">
                <div class="users-panel">
                    <h3>👥 Online (<span id="onlineCount2">0</span>)</h3>
                    <div id="onlineUsersList"></div>
                </div>

                <div class="chat-panel">
                    <div id="chatMessages" class="messages">
                        <div class="empty-state">👆 Chọn một người bạn để bắt đầu trò chuyện...</div>
                    </div>
                    <div class="message-input-container">
                        <div id="emojiPicker" class="picker-container hidden"></div>
                        <div id="stickerPicker" class="picker-container hidden"></div>

                        <div class="message-input">
                            <button id="stickerBtn" class="icon-btn" title="Stickers">🎀</button>
                            <button id="emojiBtn" class="icon-btn" title="Emoji">😀</button>
                            <label class="icon-btn file-input-label" title="Gửi ảnh">
                                <i class="fas fa-image"></i>
                                <input type="file" id="imageInput" accept="image/*,video/*" style="display: none;">
                            </label>
                            <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." maxlength="500">
                            <button id="sendBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
